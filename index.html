/* =========================================================
   TIMER
   ========================================================= */
/* The countdown runs against the wall clock, not against interval ticks.
   iOS freezes timers the moment you leave the page, so anything that counts
   by decrementing a variable stops dead when you switch apps. Storing the
   finish time and subtracting means the clock is always right when you come
   back, and survives the tab being reloaded underneath you. */
const TKEY = 'forge_rest';
let tState = 'idle', tLeft = 0, tInt = null, tTotal = 0, tEnd = 0, tDoneT = null;
let _ac = null;

/* One audio context, unlocked by the tap that starts the rest. Creating it
   fresh inside the beep fails when no gesture is recent. */
function audioCtx(){
  try{
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    if(!_ac) _ac = new AC();
    if(_ac.state === 'suspended') _ac.resume();
    return _ac;
  }catch(e){ return null; }
}

function renderTimerVisibility(){
  const on = curView==='workout';
  document.getElementById('bbar').classList.toggle('show', on);
  const fb = document.getElementById('finSession');
  if(fb) fb.textContent = 'Finish ' + DAYN[curDay];
}
function paintTimer(){
  const el = document.getElementById('timer');
  if(!el) return;
  const m = Math.floor(Math.max(0,tLeft)/60), s = Math.max(0,tLeft)%60;
  document.getElementById('tVal').textContent = m+':'+String(s).padStart(2,'0');
  el.classList.toggle('run', tState==='run');
  el.classList.toggle('done', tState==='done');
  document.getElementById('tLab').textContent = tState==='done' ? 'Go' : 'Rest';
  const frac = (tState==='idle') ? 0 : (tTotal ? Math.max(0,tLeft)/tTotal : 0);
  document.getElementById('tFill').style.width = (frac*100).toFixed(1)+'%';
}
function storeTimer(){
  try{
    if(tState==='run') localStorage.setItem(TKEY, JSON.stringify({end:tEnd, total:tTotal}));
    else localStorage.removeItem(TKEY);
  }catch(e){}
}
function resetTimer(){
  clearInterval(tInt); tInt=null;
  clearTimeout(tDoneT); tDoneT=null;
  tState='idle'; tEnd=0;
  tTotal = S.settings.rest; tLeft = S.settings.rest;
  storeTimer(); paintTimer();
}
function timerDone(lateBy){
  tLeft = 0; tState = 'done';
  clearInterval(tInt); tInt = null;
  storeTimer(); paintTimer(); buzz();
  if(lateBy >= 3){
    const m = Math.floor(lateBy/60), s = lateBy%60;
    toast('Rest finished ' + (m ? m+'m '+s+'s' : s+'s') + ' ago');
  }
  clearTimeout(tDoneT);
  tDoneT = setTimeout(()=>{ if(tState==='done') resetTimer(); }, 8000);
}
function tTick(){
  if(tState!=='run') return;
  const left = (tEnd - Date.now())/1000;
  if(left <= 0){ timerDone(Math.round(-left)); return; }
  tLeft = Math.ceil(left);
  paintTimer();
}
function startTimer(){
  clearInterval(tInt); clearTimeout(tDoneT); tDoneT=null;
  audioCtx();
  tTotal = S.settings.rest;
  tEnd = Date.now() + tTotal*1000;
  tLeft = tTotal; tState = 'run';
  storeTimer(); paintTimer();
  tInt = setInterval(tTick, 250);
}
/* Pick the countdown up wherever the clock actually is. */
function resyncTimer(){
  if(tState!=='run') return;
  clearInterval(tInt); tInt=null;
  const left = (tEnd - Date.now())/1000;
  if(left <= 0){ timerDone(Math.round(-left)); return; }
  tLeft = Math.ceil(left); paintTimer();
  tInt = setInterval(tTick, 250);
}
/* A rest that was running when the page was last closed is still running. */
function restoreTimer(){
  try{
    const raw = localStorage.getItem(TKEY); if(!raw) return;
    const o = JSON.parse(raw);
    if(!o || !o.end) return;
    tTotal = o.total || S.settings.rest;
    tEnd = o.end;
    if(tEnd - Date.now() <= 0){ localStorage.removeItem(TKEY); return; }
    tState = 'run'; resyncTimer();
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) resyncTimer(); });
window.addEventListener('pageshow', resyncTimer);
window.addEventListener('focus', resyncTimer);

function buzz(){
  if(!S.settings.sound) return;
  /* Android honours this. iOS Safari does not implement the Vibration API at
     all, so the screen flash below is the fallback there. */
  try{ if(navigator.vibrate) navigator.vibrate([170,90,170]); }catch(e){}
  const el = document.getElementById('timer');
  if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
          setTimeout(()=>el.classList.remove('flash'), 1500); }
  try{
    const c = audioCtx(); if(!c) return;
    [0,0.22,0.44].forEach(off=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=780;
      g.gain.setValueAtTime(0.0001,c.currentTime+off);
      g.gain.exponentialRampToValueAtTime(0.3,c.currentTime+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+off+0.18);
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime+off); o.stop(c.currentTime+off+0.2);
    });
  }catch(e){}
}

/* =========================================================
   EXPORT
   ========================================================= */
function dl(name, text, type){
  try{
    const b = new Blob([text], {type: type||'text/plain'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 400);
  }catch(e){ toast('Download failed'); }
}
function markBackedUp(){
  S.lastBackup = { date: todayISO(), count: S.history.length };
  save();
}
function doBackup(){
  dl('forge-backup-'+todayISO()+'.json', JSON.stringify(S,null,2), 'application/json');
  markBackedUp();
  render();
  toast('Backup saved to your files');
}
/* iOS downloads can be fiddly inside a home-screen app, so there is a second
   route that does not touch the file system at all. */
function doCopyBackup(){
  const txt = JSON.stringify(S);
  const done = ()=>{ markBackedUp(); closeModal(); render(); toast('Backup copied. Paste it somewhere safe.'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  }else fallback();
  function fallback(){
    try{
      const ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); ta.remove(); done();
    }catch(e){ toast('Could not copy. Use Download backup instead.'); }
  }
}
function doRestore(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const o = JSON.parse(String(rd.result));
        if(!o || !o.days) throw new Error('bad file');
        S = migrate(o); save(); closeModal();
        curDay='push'; setView('workout'); render();
        toast('Backup restored');
      }catch(e){ toast('That file could not be read'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function doCSV(){
  const rows = [['Date','Week','Day','Exercise','Set','Reps','Weight kg','Felt']];
  S.history.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(s=>{
    s.exercises.forEach(e=>{
      e.sets.forEach((st,i)=>{
        rows.push([s.date, s.week, DAYN[s.day], e.name, i+1, st.reps, e.bw?'BW':(st.weight==null?'':trimNum(st.weight)), e.felt||'']);
      });
    });
  });
  S.weights.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(w=>{
    rows.push([w.date,'','Bodyweight','','','','',trimNum(w.kg),'']);
  });
  const csv = '﻿' + rows.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  dl('forge-export-'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV downloaded');
}

function reportHTML(){
  const sess = S.history.slice().sort((a,b)=>a.date<b.date?-1:1);
  const ws = S.weights.slice().sort((a,b)=>a.date<b.date?-1:1);
  const totalVol = sess.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.reduce((c,x)=>c+(x.weight?x.weight*x.reps:0),0),0),0);

  const COL = {push:'#c8f04e',pull:'#60a5fa',legs:'#fb923c',shoulders:'#a78bfa'};

  let body = '';
  sess.forEach(s=>{
    body += '<section class="pg">'+
      '<div class="bar" style="background:'+COL[s.day]+'"></div>'+
      '<div class="ph"><h2>'+DAYN[s.day]+'</h2><div class="pm">'+fmtDateLong(s.date)+' · Week '+s.week+'</div></div>'+
      '<table><thead><tr><th>Exercise</th><th>Sets</th><th>What was logged</th><th>Felt</th></tr></thead><tbody>'+
      s.exercises.map(e=>'<tr><td><b>'+esc(e.name)+'</b></td><td>'+e.sets.length+'</td><td class="m">'+esc(fmtSets(e.sets,e.bw))+'</td><td>'+
        (e.felt?'<span class="p '+e.felt+'">'+(e.felt==='ok'?'JUST RIGHT':e.felt.toUpperCase())+'</span>':'<span class="p done">DONE</span>')+'</td></tr>').join('')+
      '</tbody></table>'+
    '</section>';
  });

  // progression summary
  let summary = '<section class="pg"><h2>Progression by exercise</h2>';
  DAYS.forEach(d=>{
    const rows = (S.days[d.k]||[]).map(ex=>{
      const first = sess.find(s=>s.exercises.some(e=>e.exId===ex.id));
      const firstE = first ? first.exercises.find(e=>e.exId===ex.id) : null;
      const count = sess.reduce((a,s)=>a+(s.exercises.some(e=>e.exId===ex.id)?1:0),0);
      if(!count) return '';
      return '<tr><td><b>'+esc(ex.name)+'</b></td><td>'+count+'</td><td class="m">'+esc(firstE?fmtSets(firstE.sets,ex.bw):'—')+'</td><td class="m">'+esc(ex.last?fmtSets(ex.last,ex.bw):'—')+'</td><td>'+(ex.sets||'—')+'</td></tr>';
    }).filter(Boolean).join('');
    if(!rows) return;
    summary += '<h3 style="color:'+COL[d.k]+'">'+d.n+'</h3><table><thead><tr><th>Exercise</th><th>Sessions</th><th>Started at</th><th>Now at</th><th>Sets</th></tr></thead><tbody>'+rows+'</tbody></table>';
  });
  summary += '</section>';

  let wsec = '';
  if(ws.length){
    const d = ws.length>1 ? ws[ws.length-1].kg-ws[0].kg : 0;
    wsec = '<section class="pg"><h2>Bodyweight</h2>'+
      '<div class="pm">'+ws.length+' weigh-ins · '+trimNum(ws[0].kg)+'kg → '+trimNum(ws[ws.length-1].kg)+'kg ('+(d>0?'+':'')+trimNum(d)+'kg)</div>'+
      '<table><thead><tr><th>Date</th><th>Weight</th><th>Change</th></tr></thead><tbody>'+
      ws.map((w,i)=>{ const p=ws[i-1]; const c=p?w.kg-p.kg:null;
        return '<tr><td>'+fmtDate(w.date)+'</td><td class="m">'+trimNum(w.kg)+' kg</td><td class="m">'+(c==null?'—':(c>0?'+':'')+trimNum(c)+' kg')+'</td></tr>';
      }).join('')+'</tbody></table></section>';
  }

  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Forge report '+todayISO()+'</title><style>'+
    '@page{size:A4;margin:14mm}'+
    'body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#111;font-size:11pt;line-height:1.45;margin:0}'+
    '.cover{text-align:left;padding:30mm 0 12mm;border-bottom:3px solid #111;margin-bottom:10mm}'+
    '.cover h1{font-size:30pt;margin:0;letter-spacing:-1px}'+
    '.cover .s{color:#666;margin-top:6px;font-size:12pt}'+
    '.kpis{display:flex;gap:10mm;margin-top:10mm}'+
    '.kpi b{display:block;font-size:20pt}.kpi i{font-style:normal;color:#666;font-size:9pt;text-transform:uppercase;letter-spacing:1px}'+
    '.pg{page-break-inside:avoid;margin-bottom:9mm;padding-bottom:4mm;border-bottom:1px solid #e3e3e3;position:relative}'+
    '.bar{height:4px;border-radius:2px;margin-bottom:6px;width:52px}'+
    'h2{font-size:15pt;margin:0 0 2px}h3{font-size:11pt;margin:7mm 0 2mm}'+
    '.pm{color:#666;font-size:9.5pt;margin-bottom:4mm}'+
    'table{width:100%;border-collapse:collapse;margin-top:3mm}'+
    'th{text-align:left;font-size:8pt;text-transform:uppercase;letter-spacing:.8px;color:#777;border-bottom:1.5px solid #ddd;padding:4px 6px}'+
    'td{padding:5px 6px;border-bottom:1px solid #f0f0f0;font-size:10pt;vertical-align:top}'+
    '.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9pt}'+
    '.p{font-size:7.5pt;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:4px;background:#eee;color:#555}'+
    '.p.easy{background:#dcfce7;color:#166534}.p.ok{background:#dbeafe;color:#1e40af}.p.hard{background:#ffedd5;color:#9a3412}'+
    '</style></head><body>'+
    '<div class="cover"><h1>Training report</h1><div class="s">Dylan Beaumont · True Forge Fitness<br>'+fmtDateLong(todayISO())+'</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><b>'+sess.length+'</b><i>Sessions</i></div>'+
      '<div class="kpi"><b>'+S.week.number+'</b><i>Weeks</i></div>'+
      '<div class="kpi"><b>'+(totalVol>=1000?(totalVol/1000).toFixed(1)+'t':Math.round(totalVol)+'kg')+'</b><i>Volume</i></div>'+
      (ws.length?'<div class="kpi"><b>'+trimNum(ws[ws.length-1].kg)+'kg</b><i>Bodyweight</i></div>':'')+
    '</div></div>'+
    summary + wsec + body +
    '</body></html>';
}

function doReport(){
  if(!S.history.length){ toast('Nothing to report yet'); return; }
  const html = reportHTML();
  const w = window.open('', '_blank');
  if(w){
    w.document.open(); w.document.write(html); w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 450);
    toast('Choose “Save as PDF” to share it');
  }else{
    // fallback: hidden iframe print
    let f = document.getElementById('printFrame');
    if(f) f.remove();
    f = document.createElement('iframe');
    f.id='printFrame';
    f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
    document.body.appendChild(f);
    f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
    setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Could not open the report'); } }, 500);
  }
}

/* =========================================================
   LANDING
   ========================================================= */
/* Deliberately bare: a mark, the name, and one button. Everything the app
   knows about your week lives inside the app, not on a splash screen. */
function renderLanding(){}

/* =========================================================
   VIEW SWITCH
   ========================================================= */
function setView(v){
  curView = v;
  hideExCard();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
  render();
  window.scrollTo(0,0);
}

/* =========================================================
   EVENTS
   ========================================================= */
function bind(){
  // landing
  document.getElementById('btnStart').onclick = ()=>{
    const nd = nextDay(); if(nd) curDay = nd;
    document.getElementById('landing').classList.add('hide');
    document.getElementById('app').classList.add('show');
    setView('workout'); resetTimer();
  };

  // tabs
  document.querySelectorAll('.tab').forEach(t=> t.onclick = ()=>setView(t.dataset.v));
  document.getElementById('wkChip').onclick = modalWeek;
  document.getElementById('btnSet').onclick = modalSettings;

  // bottom bar
  document.getElementById('timer').onclick = ()=>{
    if(tState==='run'){ resetTimer(); }
    else startTimer();
  };
  document.getElementById('finSession').onclick = confirmFinish;
  document.getElementById('excard').addEventListener('click', e=>{
    if(e.target.closest('.xc-x')) hideExCard();
  });

  // done overlay
  document.getElementById('dnBtn').onclick = ()=>{
    document.getElementById('done').classList.remove('show');
    render();
  };

  // modal close
  document.getElementById('mask').addEventListener('click', e=>{
    if(e.target.id==='mask'){ closeModal(); return; }
    if(e.target.closest('[data-close]')) closeModal();
  });

  // main delegated click
  document.getElementById('app').addEventListener('click', onAppClick);
  // main delegated input
  document.getElementById('app').addEventListener('input', onAppInput);
  document.getElementById('app').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.id==='wtVal'){ addWeight(); }
  });
}

function onAppClick(e){
  const t = e.target;

  // day switch
  const day = t.closest('[data-day]');
  if(day){ curDay = day.dataset.day; hideExCard(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }

  const wkday = t.closest('[data-wkday]');
  if(wkday){ curDay = wkday.dataset.wkday; hideExCard(); render(); return; }

  if(t.closest('#wkFin')){ modalWeek(); return; }

  // banner dismiss / actions
  const dis = t.closest('[data-dismiss]');
  if(dis){ S.flags[dis.dataset.dismiss]='x'; save(); render(); return; }
  const act = t.closest('[data-act]');
  if(act){
    if(act.dataset.act==='goweigh') setView('weight');
    if(act.dataset.act==='finweek') modalWeek();
    if(act.dataset.act==='pickdate') modalDate();
    if(act.dataset.act==='dobackup') doBackup();
    return;
  }

  if(t.closest('#dateBar')){ modalDate(); return; }

  // extras
  const ex2 = t.closest('[data-extra]');
  if(ex2){
    const d = getDraft(curDay); const k = ex2.dataset.extra;
    d.extra[k] = !d.extra[k];
    ex2.querySelector('.cbx').classList.toggle('on', !!d.extra[k]);
    save(); return;
  }

  // set tick
  const ok = t.closest('[data-ok]');
  if(ok){
    const card = ok.closest('[data-ex]'); if(!card) return;
    const ex = findEx(card.dataset.ex); if(!ex) return;
    const i = +ok.dataset.ok;
    const wasComplete = exComplete(curDay, ex);
    const rows = draftRows(curDay, ex);
    const row = ok.closest('.srow');
    // pull current input values in, exactly as typed. Nothing is filled in.
    row.querySelectorAll('[data-f]').forEach(inp=>{ rows[i][inp.dataset.f] = inp.value; });
    rows[i].done = !rows[i].done;
    save();
    render();
    const nowComplete = exComplete(curDay, ex);
    if(!wasComplete && nowComplete){
      showExCard(ex, rows.map(r=>({reps:num(r.reps), weight: ex.bw?null:num(r.weight)})));
    }else if(wasComplete && !nowComplete){
      hideExCard();
    }
    if(rows[i].done && S.settings.autoTimer) startTimer();
    return;
  }

  // felt
  const fe = t.closest('[data-felt]');
  if(fe){
    const d = getDraft(curDay); const id = fe.dataset.felt;
    d.felt[id] = (d.felt[id]===fe.dataset.f) ? null : fe.dataset.f;
    save(); render(); return;
  }

  // add or remove a set row
  const ar = t.closest('[data-addrow]');
  if(ar){ const ex = findEx(ar.dataset.addrow); if(ex){ addSetRow(curDay, ex); render(); } return; }
  const rr = t.closest('[data-rmrow]');
  if(rr){ const ex = findEx(rr.dataset.rmrow); if(ex){ removeSetRow(curDay, ex); render(); } return; }

  // per-exercise history
  const eh = t.closest('[data-exhist]');
  if(eh){ const ex = findEx(eh.dataset.exhist); if(ex) modalExHistory(ex); return; }

  // menu
  const mn = t.closest('[data-menu]');
  if(mn){ const ex = findEx(mn.dataset.menu); if(ex) modalExMenu(ex); return; }

  if(t.closest('#addEx')){ modalAddEx(); return; }

  // weight
  if(t.closest('#wtAdd')){ addWeight(); return; }
  const dw = t.closest('[data-delw]');
  if(dw){
    S.weights = S.weights.filter(w=>w.id!==dw.dataset.delw);
    save(); render(); toast('Removed'); return;
  }

  // history
  const hs = t.closest('[data-hs]');
  const dh = t.closest('[data-delh]');
  if(dh){
    const id = dh.dataset.delh;
    const s = S.history.find(x=>x.id===id);
    openModal('<div class="md-g"></div><div class="md-t">Delete this session?</div>'+
      '<div class="md-s">'+(s?DAYN[s.day]+' · '+fmtDate(s.date):'')+'</div>'+
      '<div class="md-btns"><button class="b-no" data-close>Cancel</button><button class="b-rd" id="dhGo">Delete</button></div>');
    document.getElementById('dhGo').onclick = ()=>{
      const sess = S.history.find(x=>x.id===id);
      if(sess && sess.week===S.week.number) S.week.done[sess.day] = Math.max(0,(S.week.done[sess.day]||0)-1);
      S.history = S.history.filter(x=>x.id!==id);
      save(); closeModal(); render(); toast('Session deleted');
    };
    return;
  }
  if(hs){ hs.classList.toggle('open'); return; }

  if(t.closest('#hReport')){ doReport(); return; }
  if(t.closest('#hCsv')){ doCSV(); return; }
  if(t.closest('#hBackup')){ doBackup(); return; }
  if(t.closest('#hRestore')){ doRestore(); return; }
}

function onAppInput(e){
  const inp = e.target.closest('[data-f]');
  if(!inp) return;
  const card = inp.closest('[data-ex]'); if(!card) return;
  const ex = findEx(card.dataset.ex); if(!ex) return;
  const row = inp.closest('.srow'); if(!row) return;
  const i = +row.dataset.set;
  const rows = draftRows(curDay, ex);
  const wasComplete = exComplete(curDay, ex);
  rows[i][inp.dataset.f] = inp.value;
  save();
  const nowComplete = exComplete(curDay, ex);
  // light-touch: update completion styling without full re-render (keeps focus)
  card.classList.toggle('done', nowComplete);
  updateProgress();

  // Finishing an exercise by typing the last value counts too, but wait for
  // typing to settle so a half-entered number does not flash up a summary.
  clearTimeout(onAppInput._t);
  if(!wasComplete && nowComplete){
    onAppInput._t = setTimeout(()=>{
      if(exComplete(curDay, ex)){
        showExCard(ex, draftRows(curDay, ex).map(r=>({reps:num(r.reps), weight: ex.bw?null:num(r.weight)})));
      }
    }, 850);
  }else if(wasComplete && !nowComplete){
    hideExCard();
  }
}
function updateProgress(){
  const list = S.days[curDay]||[];
  const done = list.filter(ex=>exComplete(curDay,ex)).length;
  const pct = list.length? Math.round(done/list.length*100):0;
  const f = document.querySelector('.prog-f'); if(f) f.style.width = pct+'%';
  const t = document.querySelector('.prog-t');
  if(t) t.innerHTML = '<span>'+done+' of '+list.length+' exercises</span><b>'+pct+'%</b>';
}

function findEx(id){
  for(const d of DAYS){
    const f = (S.days[d.k]||[]).find(x=>x.id===id);
    if(f) return f;
  }
  return null;
}

function confirmFinish(){
  const list = S.days[curDay]||[];
  const incomplete = list.filter(ex=>!exComplete(curDay,ex));
  const started = list.filter(ex=>{
    const rows = draftRows(curDay,ex);
    return rows.some(r=>String(r.reps)!=='' || String(r.weight)!=='');
  });
  if(!started.length){ toast('Log at least one set first'); return; }
  if(incomplete.length){
    openModal('<div class="md-g"></div><div class="md-t">Finish with '+incomplete.length+' left?</div>'+
      '<div class="md-s">These have no complete sets and will not be saved:<br><b style="color:var(--tx)">'+
      incomplete.map(x=>esc(x.name)).join(', ')+'</b></div>'+
      '<div class="md-btns"><button class="b-no" data-close>Keep going</button><button class="b-go" id="cfGo">Finish anyway</button></div>');
    document.getElementById('cfGo').onclick = ()=>{ closeModal(); finishSession(); };
  }else{
    finishSession();
  }
}

function addWeight(){
  const el = document.getElementById('wtVal');
  if(!el) return;
  const v = num(String(el.value).replace(',','.'));
  if(v==null || v<=0 || v>400){ toast('Enter a weight in kg'); return; }
  const t = todayISO();
  const existing = S.weights.find(w=>w.date===t);
  if(existing){ existing.kg = v; }
  else S.weights.push({id:uid(), date:t, kg:v});
  S.flags['weigh_'+t]='x';
  save(); render(); toast('Logged '+trimNum(v)+' kg');
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  S = load() || freshState();
  save();
  bind();
  renderLanding();
  resetTimer();
  restoreTimer();
  const nd = nextDay(); if(nd) curDay = nd;
  render();
}
boot();

/* expose for automated testing */
window.__forge = {
  get S(){ return S; },
  set S(v){ S = v; },
  render:render, save:save, load:load, freshState:freshState,
  finishSession:finishSession, finishWeek:finishWeek,
  setDay:function(d){ curDay=d; render(); },
  getDay:function(){ return curDay; },
  setView:setView, migrate:migrate, fmtSets:fmtSets, nextDay:nextDay,
  reportHTML:reportHTML, draftRows:draftRows, getDraft:getDraft, findEx:findEx,
  exHistory:exHistory, draftDate:draftDate, backupDue:backupDue,
  addSetRow:addSetRow, removeSetRow:removeSetRow, ghostFor:ghostFor,
  bannerQueue:bannerQueue, markBackedUp:markBackedUp,
  setDraftDate:setDraftDate, weekForDate:weekForDate,
  exComplete:function(ex){ return exComplete(curDay, ex); }
};
